<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ducky Orbit</title>
<style>
  :root { --bg:#ffffff; --fg:#1d2330; --mute:#5b6476; --line:#e2e6ee; --acc:#b8860b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0f18; --fg:#dfe6f3; --mute:#8592ab; --line:#22304c; --acc:#f2c94c; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; line-height:1.7; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:24px; margin:0 0 4px; }
  h2 { font-size:18px; margin:32px 0 8px; padding-top:16px; border-top:1px solid var(--line); }
  p, li { font-size:15px; word-break:keep-all; }
  .meta { color:var(--mute); font-size:13px; }
  .lang { display:flex; gap:12px; font-size:14px; margin:12px 0 24px; }
  a { color:var(--acc); }
  table { border-collapse:collapse; width:100%; font-size:14px; margin:8px 0; }
  th, td { border:1px solid var(--line); padding:8px; text-align:left; vertical-align:top; word-break:keep-all; }
  th { background:rgba(127,127,127,.08); }
  hr { border:0; border-top:2px solid var(--line); margin:56px 0 0; }
  .game { border:1px solid var(--line); border-radius:12px; padding:16px; margin:16px 0; }
  .game h2 { border:0; padding:0; margin:0 0 4px; }
  .links { display:flex; flex-wrap:wrap; gap:16px; font-size:14px; margin-top:8px; }
</style>
</head>
<body>
<main>
<h1>Ducky Orbit</h1>

<div class="game">

<p>자동 항법으로 운석을 캐고, 무기와 카드를 조합해 9개 성계를 정복하는 우주선 키우기.</p>
<div class="links">
<a href="corerush/privacy/">개인정보처리방침 · Privacy Policy</a>

</div>
</div>

</body>
</html>
